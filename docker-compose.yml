version: '3.8'

services:
  db:
    image: postgres:15
    container_name: gestion_compras_db
    environment:
      POSTGRES_DB: gestion_compras
      POSTGRES_USER: compras_user
      POSTGRES_PASSWORD: supersecret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compras_user -d gestion_compras"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: gestion_compras_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: backend/auth-service/Dockerfile
    container_name: gestion_compras_auth
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: gestion_compras
      POSTGRES_USER: compras_user
      POSTGRES_PASSWORD: supersecret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: myjwtsecret
      JWT_EXPIRE_MINUTES: 60
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  pac-service:
    build:
      context: .
      dockerfile: backend/pac-service/Dockerfile
    container_name: gestion_compras_pac
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: gestion_compras
      POSTGRES_USER: compras_user
      POSTGRES_PASSWORD: supersecret
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8002:8002"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: gestion_compras_frontend
    environment:
      VITE_API_URL: http://pac-service:8002
      VITE_AUTH_URL: http://auth-service:8001
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - pac-service

volumes:
  postgres_data:
