## Item

| Method | Path                                 | Auth Required | Request Body                                                                 | Response Body                                   | Status Codes |
|--------|--------------------------------------|--------------|------------------------------------------------------------------------------|--------------------------------------------------|-------------|
| POST   | /item                                | Yes          | `{ requerimiento_id: number, codigo: string, descripcion: string, cantidad: number, precio_unitario: string }` | `{ id: number }`                                | 201         |
| GET    | /item/{id}                           | Yes          | —                                                                            | `{ id: number, requerimiento_id: number, codigo: string, descripcion: string, cantidad: number, precio_unitario: string }` | 200         |
| GET    | /item?requerimiento_id={requerimiento_id} | Yes      | —                                                                            | `[{ id: number, requerimiento_id: number, codigo: string, descripcion: string, cantidad: number, precio_unitario: string }]` | 200         |

